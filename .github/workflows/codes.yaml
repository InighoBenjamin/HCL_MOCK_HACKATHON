name: BankBot Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Run TestNG Tests (headless)
        run: mvn test -Dheadless=true
        continue-on-error: true

      # Find where the HTML report actually landed
      - name: Locate HTML report
        if: always()
        run: |
          echo "=== Searching for HTML reports ==="
          find . -name "*.html" | grep -v node_modules | grep -v ".git" || true
          echo ""
          echo "=== target/surefire-reports ==="
          ls target/surefire-reports/ 2>/dev/null || echo "Directory not found"
          echo ""
          echo "=== test-output ==="
          ls test-output/ 2>/dev/null || echo "Directory not found"

      - name: Upload TestNG HTML Report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BankBot-TestNG-Report
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BankBot-Screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

      # Copy whichever report exists to a known fixed path for the email step
      - name: Prepare report for email
        if: always()
        run: |
          mkdir -p email-report
          # Try ExtentReport first
          if [ -f "reports/ExtentReport.html" ]; then
            cp reports/ExtentReport.html email-report/report.html
            echo "Used: reports/ExtentReport.html"
          # Try test-output TestNG report
          elif [ -f "test-output/BankBot_Automation_Suite/BankBot_Automation_Suite.html" ]; then
            cp test-output/BankBot_Automation_Suite/BankBot_Automation_Suite.html email-report/report.html
            echo "Used: test-output TestNG report"
          # Try surefire emailable report
          elif [ -f "target/surefire-reports/emailable-report.html" ]; then
            cp target/surefire-reports/emailable-report.html email-report/report.html
            echo "Used: target/surefire-reports/emailable-report.html"
          # Use any HTML in surefire-reports
          elif ls target/surefire-reports/*.html 2>/dev/null | head -1; then
            cp $(ls target/surefire-reports/*.html | head -1) email-report/report.html
            echo "Used: first HTML in surefire-reports"
          else
            echo "<h2>BankBot Report</h2><p>No HTML report file was found.</p>" > email-report/report.html
            echo "No report found — used placeholder"
          fi

      - name: Send Test Report Email
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "BankBot Automation — Run #${{ github.run_number }} | ${{ job.status }}"
          to: shaliniviswanathan42@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          html_body: file://email-report/report.html
          attachments: email-report/report.html